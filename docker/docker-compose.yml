# docker-compose.yml이 docker/ 폴더 안에 있으면 Compose가 프로젝트 이름을 폴더명
# "docker"로 추론한다. 다른 프로젝트도 같은 구조를 쓰면 이름이 충돌해 `docker compose
# down`이 서로의 컨테이너를 orphan으로 오인해 지울 수 있으므로 명시적으로 지정한다.
name: stock-split-extractor

services:
  extractor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../data:/app/data
      - ../secrets:/app/secrets
    env_file:
      - ../.env
    # 실행 예시:
    # docker compose -f docker/docker-compose.yml run --rm extractor python main.py --days 7
    # docker compose -f docker/docker-compose.yml run --rm extractor python main.py --start 20260101 --end 20260201

  # 컨테이너 내장 cron으로 daily 수집을 주기 실행 (스케줄은 docker/crontab 참고).
  # cron 데몬 기동에 root 권한이 필요해 user를 root로 오버라이드함.
  extractor-cron:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["/app/docker/cron-entrypoint.sh"]
    user: root
    restart: unless-stopped
    volumes:
      - ../data:/app/data
      - ../secrets:/app/secrets
    env_file:
      - ../.env
    environment:
      - TZ=Asia/Seoul
    # 반영구 운영 대비 - json-file 드라이버는 기본적으로 로그 크기 제한이 없어
    # 계속 커짐. 순수 컨테이너 stdout(cron 출력) 캡처분만 여기서 막는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
